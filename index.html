<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Tareas</title>
  <meta name="description" content="Tablero Kanban para organizar tareas en Pendiente, En progreso y Hecho.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/estilos.css">
  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- Íconos SVG: se dibujan una vez aquí y se reutilizan con <use href="#i-..."> -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-todo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-doing" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="M8 12.5l2.8 2.8L16 10" style="stroke: var(--surface-solid)"/></symbol>
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 4v16M5.5 8h1.5M11.5 8h1.5M11.5 11h1.5M17.5 8h1"/></symbol>
  </svg>

  <header class="header container">
    <a class="logo" href="./"><svg aria-hidden="true"><use href="#i-logo"/></svg>Tareas<span>.</span></a>
    <button id="theme-btn" class="icon-btn" aria-label="Cambiar tema claro u oscuro">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="container">
    <section class="intro">
      <div>
        <h1><span class="gradient-text">Tablero</span> de tareas</h1>
        <p class="lead">Arrastra las tarjetas entre columnas o usa las flechas. Todo se guarda solo en tu navegador.</p>
      </div>
      <div class="progress card">
        <div id="ring" class="ring" aria-hidden="true"><span id="progress-pct">0%</span></div>
        <div>
          <p class="progress-title">Tu progreso</p>
          <p id="progress-text" class="progress-text">0 de 0 tareas terminadas</p>
        </div>
      </div>
    </section>

    <form id="new-task" class="new-task card">
      <label for="task-title" class="sr-only">Nueva tarea</label>
      <input id="task-title" placeholder="¿Qué tienes que hacer?" maxlength="80" autocomplete="off" required>
      <label for="task-priority" class="sr-only">Prioridad</label>
      <select id="task-priority">
        <option value="alta">Prioridad alta</option>
        <option value="media" selected>Prioridad media</option>
        <option value="baja">Prioridad baja</option>
      </select>
      <button class="btn" type="submit"><svg aria-hidden="true"><use href="#i-plus"/></svg>Agregar</button>
    </form>

    <div id="board" class="board">
      <section class="column" data-status="todo" aria-labelledby="col-todo">
        <header class="column-head"><svg class="col-icon" aria-hidden="true"><use href="#i-todo"/></svg><h2 id="col-todo">Pendiente</h2><span class="count" data-count="todo">0</span></header>
        <ul class="list" data-status="todo" data-empty="Sin tareas pendientes"></ul>
      </section>
      <section class="column" data-status="doing" aria-labelledby="col-doing">
        <header class="column-head"><svg class="col-icon" aria-hidden="true"><use href="#i-doing"/></svg><h2 id="col-doing">En progreso</h2><span class="count" data-count="doing">0</span></header>
        <ul class="list" data-status="doing" data-empty="Nada en progreso"></ul>
      </section>
      <section class="column" data-status="done" aria-labelledby="col-done">
        <header class="column-head"><svg class="col-icon" aria-hidden="true"><use href="#i-done"/></svg><h2 id="col-done">Hecho</h2><span class="count" data-count="done">0</span></header>
        <ul class="list" data-status="done" data-empty="Todavía nada terminado"></ul>
        <button id="clear-done" class="btn btn-ghost clear-done" type="button">Limpiar terminadas</button>
      </section>
    </div>
  </main>

  <footer class="footer container">
    <p>Hecho por Eduardo Cruz Oleta · <a href="https://portafolio-eduardocruz.netlify.app" target="_blank" rel="noopener">Portafolio</a> · <a href="https://github.com/eduardocruzoleta-prog/tablero-tareas" target="_blank" rel="noopener">Código en GitHub</a></p>
  </footer>

  <script src="scripts/scripts.js"></script>
</body>
</html>
